[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-listen-agent"
version = "0.1.0"
description = "Read-only social listening: one agent for mention watch, platform reach, and 30-day research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Social Listen Agent contributors" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
social-listen = "social_listen.cli:main"

[project.urls]
Homepage = "https://github.com/mohamadreza-rezaei/Social-Listen-Agent"
AgentReach = "https://github.com/Panniantong/Agent-Reach"
Last30Days = "https://github.com/mvanhorn/last30days-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP017"]
